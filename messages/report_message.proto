syntax = "proto3";
package report_message;

message ReportMessage {
    uint32 id = 1;
    uint64 buttons = 2;
    uint32 x = 3;
    uint32 y = 4;
    uint32 z = 5;
    uint32 rx = 6;
    uint32 ry = 7;
    uint32 rz = 8;
    uint32 slider = 9;

    uint32 fid = 10;
    uint32 x_min = 11;
    uint32 x_centr = 12;
    uint32 x_max = 13;
    uint32 x_averaging = 14;
    uint32 x_dead_zone = 15;
    uint32 y_min = 16;
    uint32 y_centr = 17;
    uint32 y_max = 18;
    uint32 y_averaging = 19;
    uint32 y_dead_zone = 20;
    uint32 z_min = 21;
    uint32 z_centr = 22;
    uint32 z_max = 23;
    uint32 z_averaging = 24;
    uint32 z_dead_zone = 25;
    uint32 rx_min = 26;
    uint32 rx_centr = 27;
    uint32 rx_max = 28;
    uint32 rx_averaging = 29;
    uint32 rx_dead_zone = 30;
    uint32 ry_min = 31;
    uint32 ry_centr = 32;
    uint32 ry_max = 33;
    uint32 ry_averaging = 34;
    uint32 ry_dead_zone = 35;
    uint32 rz_min = 36;
    uint32 rz_centr = 37;
    uint32 rz_max = 38;
    uint32 rz_averaging = 39;
    uint32 rz_dead_zone = 40;
    uint32 slider_min = 41;
    uint32 slider_max = 42;
    uint32 slider_averaging = 43;
    uint32 slider_dead_zone = 44;
    uint32 encoder_time = 45;
    uint32 led_r = 46;
    uint32 led_g = 47;
    uint32 led_b = 48;
    uint32 hatka1_mode = 49;
    uint32 hatka2_mode = 50;
    uint32 hatka3_mode = 51;
    uint32 hatka4_mode = 52;
    uint32 control_byte = 53;
    uint32 gash_button1_min = 54;
    uint32 gash_button1_max = 55;
    uint32 gash_button2_min = 56;
    uint32 gash_button2_max = 57;
    uint32 gash_button3_min = 58;
    uint32 gash_button3_max = 59;
    uint32 spi_error_cnt = 60;
    
    // Real values received
    uint64 fbuttons = 61;
    uint32 x_axis = 62;
    uint32 y_axis = 63;
    uint32 z_axis = 64;
    uint32 rx_axis = 65;
    uint32 ry_axis = 66;
    uint32 rz_axis = 67;
    uint32 slider_axis = 68;
    uint32 fw_version = 69;
}
