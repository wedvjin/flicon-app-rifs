name: flicon
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  rust_in_flutter: ^4.11.6
  protobuf: ^3.1.0
  quick_usb: ^0.4.0
  flutter_hsvcolor_picker: ^1.5.0
  window_manager: ^0.3.6
  syncfusion_flutter_charts: ^23.1.39
  syncfusion_flutter_sliders: ^23.1.39
  toggle_switch: ^2.1.0
  chart_sparkline: ^1.0.14
  lottie: ^2.6.0
  another_flutter_splash_screen: ^1.1.7
  percent_indicator: ^4.2.3
  flutter_multi_slider: ^2.0.0
  go_router: ^11.0.0
  provider: ^6.0.2
  flutter_rust_bridge: ^1.82.3
  flutter_arc_text: ^0.5.0
  wire: ^1.5.4
  keyboard_mouse_indicator: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0


flutter:

  uses-material-design: true

  fonts:
    - family: Jost
      fonts:
        - asset: fonts/jost.ttf

  assets:
    - assets/
    - assets/right/
    - assets/left/
